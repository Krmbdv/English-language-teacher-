<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="English">
<meta name="theme-color" content="#4f46e5">
<title>English — учим английский</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6fb;--card:#fff;--text:#1d1f2e;--muted:#6b7085;--line:#e6e8f2;
  --primary:#4f46e5;--primary-soft:#eceafe;--ok:#16a34a;--ok-soft:#dcfce7;--bad:#dc2626;--bad-soft:#fee2e2;--warn:#f59e0b;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#12131a;--card:#1c1e28;--text:#f1f2f7;--muted:#9a9fb3;--line:#2b2e3b;--primary:#818cf8;--primary-soft:#262a4a;--ok:#4ade80;--ok-soft:#163323;--bad:#f87171;--bad-soft:#3a1a1a}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Nunito,-apple-system,system-ui,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:8px 0 4px;font-weight:800}
h2{font-size:20px;margin:20px 0 10px;font-weight:800}
p{line-height:1.5}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;font:inherit;color:inherit;cursor:pointer}
.tile:active{transform:scale(.98)}
.tile .ico{font-size:26px}
.tile b{display:block;margin-top:6px;font-size:16px}
.tile small{color:var(--muted)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .3s}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font:inherit;font-weight:800;font-size:16px;cursor:pointer;background:var(--primary);color:#fff;margin-top:10px}
.btn.sec{background:var(--primary-soft);color:var(--primary)}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px}.row>*{flex:1}
.stats{display:flex;gap:10px;margin:14px 0}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.stat b{font-size:22px;display:block}
.stat small{color:var(--muted)}
.back{background:none;border:0;color:var(--primary);font:inherit;font-weight:700;font-size:16px;padding:6px 0;cursor:pointer}
/* flashcard */
.flash{perspective:1000px;height:260px;margin:12px 0;cursor:pointer}
.flash-in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.flash.flip .flash-in{transform:rotateY(180deg)}
.side{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.side.b{transform:rotateY(180deg);background:var(--primary-soft)}
.side .w{font-size:34px;font-weight:800}
.side .ex{color:var(--muted);margin-top:10px;font-size:15px}
.hint{font-size:13px;color:var(--muted);position:absolute;bottom:14px}
.speak{border:0;background:var(--primary-soft);color:var(--primary);border-radius:99px;width:46px;height:46px;font-size:20px;cursor:pointer;margin-top:14px}
/* quiz */
.q{font-size:24px;font-weight:800;text-align:center;margin:18px 0 6px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 16px;font:inherit;font-size:17px;color:inherit;margin-bottom:10px;cursor:pointer}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.feedback{border-radius:14px;padding:12px 14px;margin-top:6px;font-weight:700}
.feedback.ok{background:var(--ok-soft);color:var(--ok)}
.feedback.bad{background:var(--bad-soft);color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:10px;border:2px dashed var(--line);border-radius:14px;margin:10px 0}
.chip{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 13px;font:inherit;font-size:16px;color:inherit;cursor:pointer}
.chip.used{opacity:.25;pointer-events:none}
.pill{display:inline-block;background:var(--primary-soft);color:var(--primary);border-radius:99px;padding:3px 10px;font-size:13px;font-weight:700}
.rule{background:var(--primary-soft);border-radius:14px;padding:12px 14px;margin:10px 0}
.rule code{font-family:inherit;font-weight:800;color:var(--primary)}
.done{color:var(--ok);font-weight:800}
.inp{width:100%;padding:15px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:18px}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;border:0;background:none;font:inherit;font-size:12px;font-weight:700;color:var(--muted);padding:6px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:22px}
nav button.on{color:var(--primary)}
.fade{animation:f .25s ease}
@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
</style>
</head>
<body>

function streak(){let n=0;const d=new Date();for(;;){const k=d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();if(S.days.includes(k)){n++;d.setDate(d.getDate()-1);}else break;}return n;}

    speechSynthesis.cancel();

  ${hardCount()?`<button class="tile" style="width:100%;margin-top:14px;display:flex;align-items:center;gap:12px;border-color:var(--bad)" onclick="cards('__hard')"><div class="ico">🧠</div><div style="flex:1"><b style="margin:0">Невыученные слова</b><small>${hardCount()} слов · ошибся 2+ раза</small></div><span class="muted">›</span></button>`:""}
  <div style="margin-top:6px">${TOPICS.map((t,i)=>{
    const k=t.words.filter(w=>S.known[w[0]]).length,p=Math.round(k/t.words.length*100);
    const head=(i===0||TOPICS[i-1].lvl!==t.lvl)?`<h2>${t.lvl} · ${LVL_NAMES[t.lvl]}</h2>`:"";
    return head+`<button class="tile" style="width:100%;margin-bottom:10px;display:flex;align-items:center;gap:12px" onclick="cards('${t.id}')">
      <div class="ico">${t.ico}</div><div style="flex:1"><b style="margin:0">${t.name}</b><small>${k}/${t.words.length} выучено</small><div class="bar"><i style="width:${p}%"></i></div></div></button>`;
  }).join("")}</div>`);
}
/* ===== Изучение слов: карточка → выбор перевода → написание ===== */
let C={};
const BATCH=8;
const wObj=en=>allWords().find(x=>x.en===en);
function cards(id){
  if(id==="__hard"){
    const list=Object.keys(S.hard).map(wObj).filter(Boolean);
    if(!list.length){words();return;}
    const pick=shuffle(list).slice(0,BATCH);
    C={topic:{id:"__hard",ico:"🧠",name:"Невыученные слова",words:[]},hard:true,queue:pick.map(w=>({w,fails:0})),total:pick.length,learned:0,review:false,step:"card",ok:true};
    showCard();return;
  }
  const t=topicOf(id);
  const unknown=shuffle(t.words.filter(w=>!S.known[w[0]]));
  const review=!unknown.length;
  const pick=(review?shuffle(t.words):unknown).slice(0,BATCH).map(w=>wObj(w[0])).filter(Boolean);
  C={topic:t,queue:pick.map(w=>({w,fails:0})),total:pick.length,learned:0,review,step:"card",ok:true};
  showCard();
}
function cardHead(){
  const t=C.topic,done=C.total-C.queue.length;
  return `<button class="back" onclick="words()">‹ Темы</button>
  <div style="display:flex;justify-content:space-between;align-items:center"><span class="pill">${t.ico} ${t.name}${C.review?" · повторение":""}</span><span class="muted">${done} / ${C.total}</span></div>
  <div class="bar"><i style="width:${done/C.total*100}%"></i></div>`;
}
function showCard(){
  const t=C.topic;
  if(!C.queue.length&&C.hard){
    const n=hardCount();
    render(`<div class="card" style="text-align:center;margin-top:20px"><div style="font-size:48px">🧠</div><h2>Тренировка окончена</h2>
      <p class="muted">Без ошибок: ${C.learned} из ${C.total}<br>${n?"В списке невыученных: "+n+" слов":"Все трудные слова выучены! 🎉"}</p>
      <p class="muted" style="font-size:14px">Слово уходит из списка после 2 правильных ответов без ошибок подряд.</p>
      ${n?`<button class="btn" onclick="cards('__hard')">Ещё тренировка</button>`:""}<button class="btn sec" onclick="go('words')">К словам</button></div>`);
    return;
  }
  if(!C.queue.length){
    const left=t.words.filter(w=>!S.known[w[0]]).length;
    render(`<button class="back" onclick="words()">‹ Темы</button><div class="card" style="text-align:center;margin-top:20px">
      <div style="font-size:48px">🎉</div><h2>Урок пройден!</h2>
      <p class="muted">С первой попытки: ${C.learned} из ${C.total}<br>В теме осталось выучить: ${left} из ${t.words.length}</p>
      <button class="btn" onclick="cards('${t.id}')">${left?"Следующие слова":"Повторить тему"}</button>
      <button class="btn sec" onclick="quizStart('${t.id}')">Тест по теме</button></div>`);
    return;
  }
  const item=C.queue[0],w=item.w,q=s=>esc(s).replace(/'/g,"\\'");
  if(C.step==="card"){
    C.ok=item.fails===0;
    render(cardHead()+`
    <div class="flash" onclick="this.classList.toggle('flip')">
      <div class="flash-in">
        <div class="side"><div class="w">${esc(w.en)}</div>${item.fails?'<div class="muted" style="margin-top:6px">повторяем ещё раз</div>':(w.en in S.hard)?`<div class="muted" style="margin-top:6px">🧠 трудное слово · ${S.hard[w.en]}/2</div>`:""}
          <button class="speak" onclick="event.stopPropagation();speak('${q(w.en)}')">🔊</button><div class="hint">нажми, чтобы перевернуть</div></div>
        <div class="side b"><div class="w" style="font-size:28px">${esc(w.ru)}</div><div class="ex">${esc(w.ex)}</div>
          <button class="speak" onclick="event.stopPropagation();speak('${q(w.ex)}')">🔊</button></div>
      </div>
    </div>
    <p class="muted" style="text-align:center;margin:0">Запомни, как слово пишется и что значит</p>
    <button class="btn" onclick="C.step='choice';showCard()">Проверить себя →</button>`);
    setTimeout(()=>speak(w.en),200);
  }
  else if(C.step==="choice"){
    const opts=shuffle([w,...similar(w,3)]);C.correct=opts.indexOf(w);
    render(cardHead()+`<p class="muted" style="text-align:center;margin:16px 0 0">Шаг 1 из 2 · выбери перевод</p>
    <div class="q">${esc(w.en)}</div>
    <div style="margin-top:14px">${opts.map((o,i)=>`<button class="opt" onclick="cardChoice(${i},this)">${esc(o.ru)}</button>`).join("")}</div><div id="fb"></div>`);
  }
  else if(C.step==="write"||C.step==="retype"){
    const re=C.step==="retype";
    const hint=w.en.split(" ").map(p=>p[0]+"·".repeat(Math.max(p.length-1,0))).join("  ");
    render(cardHead()+`<p class="muted" style="text-align:center;margin:16px 0 0">Шаг 2 из 2 · ${re?"перепиши правильно":"напиши по-английски"}</p>
    <div class="q">${esc(w.ru)} ${sayBtn(w.en)}</div>
    ${re?`<div class="feedback bad" style="text-align:center;font-size:22px;letter-spacing:1px">${esc(w.en)}</div>`:`<div class="muted" style="text-align:center;letter-spacing:2px;margin-bottom:10px">${esc(hint)}</div>`}
    <form onsubmit="event.preventDefault();cardWrite()"><input id="ti" class="inp" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${re?"Набери слово ещё раз":"Введи слово"}">
    <button class="btn">Проверить</button></form><div id="fb"></div>`);
    setTimeout(()=>{const i=document.getElementById("ti");if(i)i.focus();},50);
  }
}
function cardChoice(i,el){
  const btns=document.querySelectorAll(".opt");if(btns[0].disabled)return;btns.forEach(b=>b.disabled=true);
  btns[C.correct].classList.add("ok");const ok=i===C.correct;
  if(!ok){el.classList.add("bad");C.ok=false;miss(C.queue[0].w.en);}
  document.getElementById("fb").innerHTML=`<div class="feedback ${ok?"ok":"bad"}">${ok?"Верно!":"Не совсем. Запомни: "+esc(C.queue[0].w.ru)}</div><button class="btn" onclick="C.step='write';showCard()">Дальше</button>`;
}
function cardWrite(){
  const inp=document.getElementById("ti");const item=C.queue[0],w=item.w;
  const got=norm(inp.value);if(!got)return;
  if(got===norm(w.en)){
    speak(w.en);
    if(C.step==="write"&&C.ok){
      if(w.en in S.hard){S.hard[w.en]++;if(S.hard[w.en]>=2){delete S.hard[w.en];delete S.miss[w.en];S.known[w.en]=1;}}
      else S.known[w.en]=1;
      C.learned++;addXP(3);C.queue.shift();}
    else{item.fails++;markDay();const it=C.queue.shift();if(item.fails<=2)C.queue.push(it);else delete S.known[w.en];}
    save();
    const wasOk=C.step==="write"&&C.ok;
    document.getElementById("fb").innerHTML=`<div class="feedback ok">${wasOk?"Отлично! Слово выучено ✓":"Правильно! Это слово ещё повторим."}</div><button class="btn" id="nx">Дальше</button>`;
    inp.disabled=true;document.querySelector("form .btn").style.display="none";
    document.getElementById("nx").onclick=()=>{C.step="card";showCard();};
    if(wasOk&&C.queue.length===0){}
  }else{
    if(C.step==="write")miss(w.en);
    C.ok=false;delete S.known[w.en];save();
    if(C.step==="write"){C.step="retype";showCard();
      document.getElementById("fb").innerHTML=`<div class="muted" style="text-align:center;margin-top:8px">Ты написал: <s>${esc(inp.value)}</s></div>`;}
    else{inp.value="";inp.style.borderColor="var(--bad)";inp.placeholder="Посмотри внимательно и набери ещё раз";}
  }
}

/* ===================== QUIZ ===================== */
const LVL_NAMES={A1:"Начальный",A2:"Элементарный",B1:"Средний",B2:"Выше среднего"};
const topicOf=id=>TOPICS.find(t=>t.id===id);
function lev(a,b){a=a.toLowerCase();b=b.toLowerCase();const m=a.length,n=b.length;if(!m)return n;if(!n)return m;
  let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[n];}
const sim=(a,b)=>1-lev(a,b)/Math.max(a.length,b.length);
const ruTokens=r=>r.toLowerCase().split(/[\/,;()?!.]/).map(s=>s.trim()).filter(Boolean);
const norm=s=>s.toLowerCase().replace(/[.,!?'’"«»—-]/g,"").replace(/\s+/g," ").trim();
const canSpeak=()=>{try{return "speechSynthesis" in window}catch(e){return false}};

/* похожие варианты: та же тема, похожее написание, похожая длина */
function similar(w,n){
  const all=allWords(),wt=topicOf(w.topic),wTok=new Set(ruTokens(w.ru));
  const multi=w.en.includes(" ");
  const scored=all.filter(x=>x.en!==w.en).map(x=>{
    const xt=topicOf(x.topic);
    let s=(x.topic===w.topic?4:0)+(xt.lvl===wt.lvl?1:0)+sim(x.en,w.en)*3+sim(x.ru,w.ru)*1.5;
    s+=(x.en.includes(" ")===multi?1.5:-2);
    s-=Math.abs(x.en.length-w.en.length)/6;
    if(x.en[0].toLowerCase()===w.en[0].toLowerCase())s+=.7;
    return {x,s:s+Math.random()*1.6};
  }).sort((a,b)=>b.s-a.s);
  const out=[],usedTok=new Set(wTok),usedEn=new Set([w.en.toLowerCase()]);
  for(const {x} of scored){
    if(out.length>=n)break;
    const t=ruTokens(x.ru);
    if(t.some(k=>usedTok.has(k))||usedEn.has(x.en.toLowerCase()))continue;
    t.forEach(k=>usedTok.add(k));usedEn.add(x.en.toLowerCase());out.push(x);
  }
  return out;
}
function gapOf(w){
  if(!w.ex)return null;
  const re=new RegExp("\\b"+w.en.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","i");
  return re.test(w.ex)?w.ex.replace(re,"_____"):null;
}

function quizStart(topicId){
  setTab("quiz");
  if(topicId){runQuiz(topicOf(topicId).words.map(w=>allWords().find(x=>x.en===w[0])).filter(Boolean),topicId);return;}
  const kn=allWords().filter(w=>S.known[w.en]).length;
  const btn=(spec,ico,title,sub)=>`<button class="tile" style="width:100%;margin-bottom:10px;display:flex;align-items:center;gap:12px" onclick="quizPick('${spec}')"><div class="ico">${ico}</div><div style="flex:1"><b style="margin:0">${title}</b><small>${sub}</small></div><span class="muted">›</span></button>`;
  render(`<h1>Тест</h1><p class="muted" style="margin:0">12 вопросов разных типов: выбор, ввод с клавиатуры, на слух и пропуск в предложении. Варианты похожи друг на друга — придётся думать.</p>
  <h2>Что проверяем?</h2>
  ${btn("known","⭐","Мои выученные слова",kn>=8?kn+" слов":"нужно отметить хотя бы 8 слов")}
  ${["A1","A2","B1","B2"].map(l=>btn(l,{A1:"🌱",A2:"🌿",B1:"🌳",B2:"🏔️"}[l],l+" · "+LVL_NAMES[l],allWords().filter(w=>topicOf(w.topic).lvl===l).length+" слов")).join("")}
  ${btn("all","🔥","Всё подряд","максимальная сложность")}`);
}
function quizPick(spec){
  const all=allWords();let pool;
  if(spec==="known"){pool=all.filter(w=>S.known[w.en]);if(pool.length<8){render(`<div class="card" style="margin-top:20px"><b>Пока мало выученных слов</b><p class="muted">Отметь в разделе «Слова» хотя бы 8 слов кнопкой «Знаю ✓».</p><button class="btn" onclick="go('words')">К словам</button><button class="btn sec" onclick="quizStart()">Назад</button></div>`);return;}}
  else if(spec==="all")pool=all;
  else pool=all.filter(w=>topicOf(w.topic).lvl===spec);
  runQuiz(pool,null,spec);
}
function runQuiz(pool,topicId,spec){
  const types=["en2ru","ru2en","type","gap","ru2en","type"];if(canSpeak())types.push("listen");
  const qs=shuffle(pool).slice(0,12).map(w=>{
    let t=types[Math.floor(Math.random()*types.length)];
    const gap=gapOf(w);if(t==="gap"&&!gap)t="type";
    if(t==="type"&&w.en.length>22)t="ru2en";
    const d=similar(w,3);
    if(t==="type")return {t,w};
    const opts=shuffle([w,...d]);
    const show=(t==="en2ru"||t==="listen")?"ru":"en";
    return {t,w,gap,opts:opts.map(o=>o[show]),correct:opts.indexOf(w)};
  });
  Q={qs,i:0,score:0,topicId,spec};showQ();
}
const QLABEL={en2ru:"Переведи на русский",ru2en:"Переведи на английский",type:"Напиши по-английски",listen:"Послушай и выбери перевод",gap:"Вставь пропущенное слово"};
function sayBtn(t,big){return `<button class="speak" style="${big?"width:64px;height:64px;font-size:28px":"width:38px;height:38px;font-size:16px;margin:0;vertical-align:middle"}" onclick="speak('${esc(t).replace(/'/g,"\\'")}')">🔊</button>`;}
function showQ(){
  if(Q.i>=Q.qs.length){
    const s=Q.score,n=Q.qs.length;if(s>S.quizBest)S.quizBest=s;addXP(s*4);
    const again=Q.topicId?`quizStart('${Q.topicId}')`:`quizPick('${Q.spec}')`;
    render(`<div class="card" style="text-align:center;margin-top:20px"><div style="font-size:52px">${s>=10?"🏆":s>=7?"👍":"💪"}</div>
    <h2>${s} из ${n}</h2><p class="muted">${s>=10?"Отлично!":s>=7?"Хорошо, продолжай!":"Повтори слова и попробуй ещё."} +${s*4} очков</p>
    <button class="btn" onclick="${again}">Ещё раз</button><button class="btn sec" onclick="quizStart()">Другой тест</button></div>`);
    return;
  }
  const q=Q.qs[Q.i],w=q.w;
  let body="";
  if(q.t==="en2ru")body=`<div class="q">${esc(w.en)} ${sayBtn(w.en)}</div>`;
  else if(q.t==="ru2en"||q.t==="type")body=`<div class="q">${esc(w.ru)}</div>`;
  else if(q.t==="listen")body=`<div style="text-align:center;margin:18px 0">${sayBtn(w.en,true)}<div class="muted" style="margin-top:6px">нажми, чтобы прослушать ещё раз</div></div>`;
  else if(q.t==="gap")body=`<div class="q" style="font-size:20px">${esc(q.gap)}</div><div class="muted" style="text-align:center">(${esc(w.ru)})</div>`;
  let answer;
  if(q.t==="type"){
    const hint=w.en.split(" ").map(p=>p[0]+"·".repeat(Math.max(p.length-1,0))).join("  ");
    answer=`<div class="muted" style="text-align:center;letter-spacing:2px;margin-bottom:10px">${esc(hint)}</div>
    <form onsubmit="event.preventDefault();ansType()"><input id="ti" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Введи ответ" style="width:100%;padding:15px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:18px">
    <button class="btn" id="tb">Проверить</button></form>`;
  }else answer=q.opts.map((o,i)=>`<button class="opt" onclick="ansQ(${i},this)">${esc(o)}</button>`).join("");
  render(`<div style="display:flex;justify-content:space-between;gap:8px"><span class="pill">${QLABEL[q.t]}</span><span class="muted">${Q.i+1}/${Q.qs.length} · ✓ ${Q.score}</span></div>
  <div class="bar"><i style="width:${Q.i/Q.qs.length*100}%"></i></div>${body}
  <div style="margin-top:14px">${answer}</div><div id="fb"></div>`);
  if(q.t==="listen")setTimeout(()=>speak(w.en),250);
  if(q.t==="type")setTimeout(()=>{const i=document.getElementById("ti");if(i)i.focus();},50);
}
function nextBtn(){return `<button class="btn" onclick="Q.i++;showQ()">Дальше</button>`;}
function ansQ(i,el){
  const q=Q.qs[Q.i],w=q.w;const btns=document.querySelectorAll(".opt");
  if(btns[0].disabled)return;btns.forEach(b=>b.disabled=true);
  btns[q.correct].classList.add("ok");
  const ok=i===q.correct;if(ok)Q.score++;else{el.classList.add("bad");miss(w.en);}
  speak(q.t==="gap"?w.ex:w.en);
  document.getElementById("fb").innerHTML=`<div class="feedback ${ok?"ok":"bad"}">${ok?"Верно! 🎉":"Правильно: "+esc(q.opts[q.correct])}<div style="font-weight:500;margin-top:4px">${esc(w.en)} — ${esc(w.ru)}</div></div>${nextBtn()}`;
}
function ansType(){
  const q=Q.qs[Q.i],w=q.w,inp=document.getElementById("ti");if(!inp||inp.disabled)return;
  const got=norm(inp.value),want=norm(w.en);if(!got)return;
  inp.disabled=true;document.getElementById("tb").style.display="none";
  const d=lev(got,want),exact=d===0,close=!exact&&want.length>=5&&d===1;
  if(exact||close)Q.score++;else miss(w.en);
  inp.style.borderColor=exact||close?"var(--ok)":"var(--bad)";
  speak(w.en);
  document.getElementById("fb").innerHTML=`<div class="feedback ${exact||close?"ok":"bad"}">${exact?"Верно! 🎉":close?"Почти! Одна опечатка, засчитано.":"Неверно."}<div style="font-weight:500;margin-top:4px">Правильно: <b>${esc(w.en)}</b></div></div>${nextBtn()}`;
}

/* ===================== SENTENCE BUILDER ===================== */
let B={};
const EXTRA_WORDS=["is","are","am","do","does","did","the","a","an","to","in","on","at","for","was","were","have","has","will","not","my","your","his","her","it","they","we","you"];
function buildStart(){B={list:shuffle(SENTENCES).slice(0,8),i:0,score:0};showB();}
function showB(){
  if(B.i>=B.list.length){addXP(B.score*5);
    render(`<div class="card" style="text-align:center;margin-top:20px"><div style="font-size:52px">🧩</div><h2>${B.score} из ${B.list.length}</h2><p class="muted">+${B.score*5} очков</p>
    <button class="btn" onclick="buildStart()">Ещё фразы</button></div>`);return;}
  const [en,ru]=B.list[B.i];
  B.words=en.split(" ");
  const lower=new Set(B.words.map(x=>x.toLowerCase()));
  const extra=shuffle(EXTRA_WORDS.filter(x=>!lower.has(x))).slice(0,B.words.length>6?3:2);
  B.mix=shuffle(B.words.concat(extra).map(w=>({w})));B.picked=[];
  render(`<div style="display:flex;justify-content:space-between"><span class="pill">Собери фразу</span><span class="muted">${B.i+1}/${B.list.length}</span></div>
  <div class="bar"><i style="width:${B.i/B.list.length*100}%"></i></div>
  <div class="q" style="font-size:21px">«${esc(ru)}»</div>
  <div class="muted" style="text-align:center;font-size:14px">Осторожно: среди слов есть лишние</div>
  <div class="chips" id="ans"></div>
  <div class="chips" style="border:0;padding:0" id="pool"></div>
  <div class="row"><button class="btn sec" onclick="B.picked=[];drawB()">Сбросить</button><button class="btn" id="chk" onclick="checkB()" disabled>Проверить</button></div>
  <div id="fb"></div>`);
  drawB();
}
function drawB(){
  document.getElementById("ans").innerHTML=B.picked.map((k,j)=>`<button class="chip" onclick="B.picked.splice(${j},1);drawB()">${esc(B.mix[k].w)}</button>`).join("")||'<span class="muted" style="padding:8px">Нажимай на слова ниже</span>';
  document.getElementById("pool").innerHTML=B.mix.map((m,k)=>`<button class="chip ${B.picked.includes(k)?"used":""}" onclick="B.picked.push(${k});drawB()">${esc(m.w)}</button>`).join("");
  document.getElementById("chk").disabled=B.picked.length<2;
}
function checkB(){
  const en=B.list[B.i][0];const got=B.picked.map(k=>B.mix[k].w).join(" ");
  const ok=norm(got)===norm(en);if(ok)B.score++;
  speak(en);
  document.querySelectorAll(".chip").forEach(c=>c.disabled=true);document.getElementById("chk").disabled=true;
  document.getElementById("fb").innerHTML=`<div class="feedback ${ok?"ok":"bad"}">${ok?"Верно! 🎉":"Правильно: "+esc(en)}</div><button class="btn" onclick="B.i++;showB()">Дальше</button>`;
}

/* ===================== GRAMMAR ===================== */
function grammar(){
  render(`<h1>Грамматика</h1><p class="muted" style="margin:0">Короткое правило и упражнения. Иди по порядку.</p>
  <div style="margin-top:14px">${GRAMMAR.map((g,i)=>`<button class="tile" style="width:100%;margin-bottom:10px;display:flex;align-items:center;gap:12px" onclick="gTopic('${g.id}')">
    <div class="ico" style="width:34px;text-align:center;font-weight:800;color:var(--primary)">${i+1}</div>
    <div style="flex:1"><b style="margin:0">${g.name}</b><small>${g.lvl}${S.grammar[g.id]?` · <span class="done">✓ ${S.grammar[g.id]}/${g.ex.length}</span>`:""}</small></div><span class="muted">›</span></button>`).join("")}</div>`);
}
let G={};
function gTopic(id){const g=GRAMMAR.find(x=>x.id===id);
  render(`<button class="back" onclick="grammar()">‹ Темы</button><span class="pill" style="margin-left:8px">${g.lvl}</span><h1>${g.name}</h1><div class="card">${g.rule}</div>
  <button class="btn" onclick="gStart('${id}')">Начать упражнения (${g.ex.length})</button>`);}
function gStart(id){G={g:GRAMMAR.find(x=>x.id===id),i:0,score:0};gShow();}
function gShow(){const g=G.g;
  if(G.i>=g.ex.length){const best=Math.max(S.grammar[g.id]||0,G.score);S.grammar[g.id]=best;addXP(G.score*3);
    render(`<div class="card" style="text-align:center;margin-top:20px"><div style="font-size:52px">${G.score===g.ex.length?"🏆":"📖"}</div><h2>${G.score} из ${g.ex.length}</h2><p class="muted">${g.name} · +${G.score*3} очков</p>
    <button class="btn" onclick="gStart('${g.id}')">Повторить</button><button class="btn sec" onclick="gTopic('${g.id}')">Перечитать правило</button><button class="btn sec" onclick="grammar()">Все темы</button></div>`);return;}
  const [s,opts,c]=g.ex[G.i];
  render(`<button class="back" onclick="gTopic('${g.id}')">‹ Правило</button>
  <div style="display:flex;justify-content:space-between"><span class="pill">${g.name}</span><span class="muted">${G.i+1}/${g.ex.length}</span></div>
  <div class="bar"><i style="width:${G.i/g.ex.length*100}%"></i></div>
  <div class="q" style="font-size:22px">${esc(s).replace("___",'<span style="color:var(--primary)">___</span>')}</div>
  <div style="margin-top:16px">${opts.map((o,i)=>`<button class="opt" onclick="gAns(${i},this)">${esc(o)}</button>`).join("")}</div><div id="fb"></div>`);
}
function gAns(i,el){const [s,opts,c]=G.g.ex[G.i];const btns=document.querySelectorAll(".opt");
  if(btns[0].disabled)return;btns.forEach(b=>b.disabled=true);btns[c].classList.add("ok");
  const ok=i===c;if(ok)G.score++;else el.classList.add("bad");
  const full=s.replace("___",opts[c]);speak(full);
  document.getElementById("fb").innerHTML=`<div class="feedback ${ok?"ok":"bad"}">${ok?"Верно! 🎉":"Правильно:"} ${esc(full)}</div><button class="btn" onclick="G.i++;gShow()">Дальше</button>`;}

/* voices load async on iOS */
try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{};}catch(e){}
go("home");
</script>
